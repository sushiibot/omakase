name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx tsc --ignoreConfig --noEmit --strict --skipLibCheck --module preserve --moduleResolution bundler --target es2022 --types bun --allowImportingTsExtensions scripts/test-timing-summary.ts scripts/test-timing-summary.test.ts
      - run: bun run check:architecture

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The workspace image ships ripgrep for history/search; without it those tests skip rather than run.
      - name: Install ripgrep and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep ffmpeg
      - run: bun install --frozen-lockfile
      # Keep Git subprocess tests on Bun's established sequential runner within each shard.
      - name: Run backend shard with fresh timings
        run: |
          rm -f "${{ runner.temp }}/bun-timings-${{ matrix.shard }}.json"
          bun run test --shard=${{ matrix.shard }}/2 --timings="${{ runner.temp }}/bun-timings-${{ matrix.shard }}.json" --update-timings
        env:
          # config.ts requires the OpenAI key at import time; no test calls OpenAI, so a dummy is enough.
          OPENAI_API_KEY: test-key
      - name: Summarize backend timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun scripts/test-timing-summary.ts bun "${{ runner.temp }}/bun-timings-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: backend-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/bun-timings-${{ matrix.shard }}.json
          retention-days: 7

  # Web static checks and unit tests. Browser shards build and test the app separately.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint

  # Browser shards run independently; web checks and unit tests above run only once.
  web-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Each shard builds the production app and harness before preview.
      # Notification tests require full Chromium, not headless shell.
      - run: bunx playwright install --with-deps --no-shell chromium
      - run: bun run test:e2e --grep-invert @performance --shard=${{ matrix.shard }}/2
      - name: Summarize browser timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun ../scripts/test-timing-summary.ts playwright playwright-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: web-e2e-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-results.json
          retention-days: 7

  # Timing budgets get their own runner, without functional browser workers competing for CPU.
  web-performance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --no-shell chromium
      - run: bun run test:e2e --grep @performance --workers=1
      - name: Summarize browser timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun ../scripts/test-timing-summary.ts playwright playwright-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: web-performance
          path: |
            web/test-results
            web/playwright-results.json
          retention-days: 7

  # Real-process e2e (e2e-system/README.md): the built web app, the gateway and the workspace as processes,
  # with a fake model and a Traefik stand-in dialing from loopback aliases.
  e2e-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The workspace runs history/search with ripgrep, as in its image.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: e2e-system
      - run: bunx tsc --noEmit
        working-directory: e2e-system
      - run: bunx playwright install --with-deps --no-shell chromium
        working-directory: e2e-system
      # The harness needs 127.0.0.2/.3/.5; its preflight fails fast if they don't route to lo.
      - name: Show loopback routes
        run: ip -4 route show table local
      - run: bun run e2e:system
        env:
          E2E_TMP_DIR: ${{ runner.temp }}/e2e-system
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-system
          path: |
            ${{ runner.temp }}/e2e-system/logs
            ${{ runner.temp }}/e2e-system/playwright
          retention-days: 7

  # Builds the image natively per arch (the deploy host is arm64) and drives a real browser in it.
  browser-smoke:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t omakase:smoke .
      - run: docker run --rm --init omakase:smoke sh scripts/browser-smoke.sh
      # Workspace target under its production hardening (non-root, no caps, no privilege escalation),
      # through its own entrypoint. docker-build-workspace needs this job, so a failure blocks the push.
      - run: docker build --target workspace -t omakase:smoke-workspace .
      - run: >-
          docker run --rm --init --user 1000:1000 --cap-drop ALL
          --security-opt no-new-privileges --shm-size 1g
          omakase:smoke-workspace sh scripts/browser-smoke.sh

  docker-build:
    needs: [typecheck, test, web, web-e2e, web-performance, browser-smoke, e2e-system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@bdbe0b00a8ac8bff852e805632d31bfb7b9a0c82
    with:
      image_name: ghcr.io/sushiibot/omakase
      artifact_name: gateway
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  docker-build-workspace:
    needs: [typecheck, test, browser-smoke, e2e-system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@bdbe0b00a8ac8bff852e805632d31bfb7b9a0c82
    with:
      image_name: ghcr.io/sushiibot/omakase
      build_target: workspace
      artifact_name: workspace
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # Wait for the exact gateway receipt before releasing its dependent workspace.
  deploy:
    needs: [docker-build, typecheck, test, web, web-e2e, web-performance, browser-smoke, e2e-system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: read
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@bdbe0b00a8ac8bff852e805632d31bfb7b9a0c82
    with:
      target: gateway
      artifact_name: gateway
      image_name: ghcr.io/sushiibot/omakase
      artifact_digest: ${{ needs.docker-build.outputs.artifact_digest }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  # After the gateway: a new workspace may send fields an older gateway drops.
  deploy-workspace:
    needs: [deploy, docker-build-workspace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: read
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@bdbe0b00a8ac8bff852e805632d31bfb7b9a0c82
    with:
      target: workspace
      artifact_name: workspace
      image_name: ghcr.io/sushiibot/omakase
      artifact_digest: ${{ needs.docker-build-workspace.outputs.artifact_digest }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
