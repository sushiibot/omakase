name: Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: bun install --frozen-lockfile
      - run: bun run sync
      - name: Restore signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret" >&2; exit 1; }
          umask 077
          mkdir -p .local
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .local/debug.keystore
      - name: Test and build APK
        run: |
          ./android/gradlew -p android --no-daemon --max-workers=2 \
            -PmobileVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PmobileVersionName="1.0.$GITHUB_RUN_NUMBER" \
            testDebugUnitTest assembleDebug
      - name: Prepare download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/omakase.apk
          cd dist
          sha256sum omakase.apk > SHA256SUMS
      - name: Upload APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omakase-android-${{ github.run_number }}
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish Android update
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/publish-update.ts
      - name: Remove signing key
        if: always()
        run: rm -f .local/debug.keystore
